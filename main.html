<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <title>AOC 2022</title>
    <style>
        body {
            margin: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }
        
        .hidden {
            display: none;
        }

        #info {
            position: absolute;
            left: 100px;
            top: 10px;
            width: 100% - 100px;
            text-align: left;
            z-index: 100;
            background-color: #1f1f1f;
            color: #eee;
            font-size: 11px;
            font: 11px 'Lucida Grande', sans-serif;
            /* text-shadow: -1px -1px 0 #111; */
            display:block;
        }
    </style>
</head>
<body>
    <div id="info">Description</div>

    <!-- Import maps polyfill -->
    <!-- Remove this when import maps will be widely supported -->
    <script async src="https://unpkg.com/es-module-shims@1.3.6/dist/es-module-shims.js"></script>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.158/build/three.module.js",
            "three/examples/jsm/": "https://unpkg.com/three@0.158/examples/jsm/",
            "three/addons/": "https://unpkg.com/three@0.158/examples/jsm/",
            "./threeEngine": "../../threeEngine.js",
            "lil-gui": "./lil-gui/lil-gui.esm.js",
            "three-bvh-csg": "../node_modules/three-bvh-csg/build/index.module.js",
            "three-mesh-bvh": "../node_modules/three-mesh-bvh/build/index.module.js",
            "/*.ts": "./"
        }
    }
    </script>

    <script type="module" src="main.js"></script>
</body>
</html>
